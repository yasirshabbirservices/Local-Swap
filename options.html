<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Local-Swap Options</title>
  <style>
    /* */
    :root {
      /* Base Theme Colors */
      --bg-base: #09090b;
      --bg-surface: #18181b;
      --bg-surface-hover: #27272a;
      --border-color: #3f3f46;
      --text-main: #f4f4f5;
      --text-muted: #a1a1aa;
      
      /* Logo Extracted Colors */
      --brand-teal: #62a88d;
      --brand-orange: #db6443;
      
      /* Status Colors */
      --status-error: #ef4444;
      --status-success: #10b981;
      
      /* Utilities */
      --radius-sm: 6px;
      --radius-md: 10px;
      --transition: 0.2s ease;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      width: 480px; /* Slightly wider for a better UX with labels and toggles */
      margin: 0 auto;
      background-color: var(--bg-base);
      color: var(--text-main);
      min-height: 600px;
      display: flex;
      flex-direction: column;
    }

    /* */
    .header {
      background: linear-gradient(135deg, rgba(98,168,141,0.15) 0%, rgba(219,100,67,0.15) 100%);
      border-bottom: 1px solid var(--border-color);
      padding: 24px;
    }
    .header h1 {
      font-size: 20px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
      letter-spacing: -0.02em;
    }
    .header h1 span {
      background: linear-gradient(90deg, var(--brand-teal), var(--brand-orange));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .subtitle {
      color: var(--text-muted);
      margin-top: 8px;
      font-size: 13px;
      line-height: 1.5;
    }

    .content {
      flex: 1;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* */
    .action-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .action-bar h2 {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-main);
    }
    .action-group {
      display: flex;
      gap: 8px;
    }
    
    .btn-secondary {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      font-size: 12px;
      font-weight: 500;
      padding: 6px 12px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: var(--transition);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .btn-secondary:hover {
      background: var(--bg-surface-hover);
      border-color: var(--text-muted);
    }

    /* */
    .rule-list { display: flex; flex-direction: column; gap: 12px; }

    .rule-row {
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 16px;
      transition: var(--transition);
    }
    .rule-row.inactive { 
      opacity: 0.5; 
      border-style: dashed;
    }
    .rule-row.inactive:hover { opacity: 0.8; }
    
    .rule-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .rule-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-main);
    }

    .rule-controls { display: flex; align-items: center; gap: 12px; }

    /* */
    .toggle-switch {
      position: relative;
      display: inline-block;
      width: 34px;
      height: 20px;
    }
    .toggle-switch input { opacity: 0; width: 0; height: 0; margin: 0; }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: var(--border-color);
      transition: .3s;
      border-radius: 20px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 14px;
      width: 14px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }
    input:checked + .slider { background-color: var(--brand-teal); }
    input:checked + .slider:before { transform: translateX(14px); }

    /* */
    .btn-icon {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
      border-radius: 4px;
      transition: var(--transition);
    }
    .btn-icon:hover {
      background: rgba(239, 68, 68, 0.15);
      color: var(--status-error);
    }

    .rule-pair { display: flex; align-items: center; gap: 10px; }
    .rule-host {
      flex: 1;
      background: var(--bg-base);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      padding: 8px 10px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 12px;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .arrow { color: var(--brand-orange); font-size: 14px; flex-shrink: 0; font-weight: bold;}

    .empty {
      color: var(--text-muted);
      text-align: center;
      padding: 40px 20px;
      border: 1px dashed var(--border-color);
      border-radius: var(--radius-md);
      font-size: 13px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .empty svg { opacity: 0.5; color: var(--brand-teal); }

    .add-form {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    
    .field { display: flex; flex-direction: column; gap: 6px; }
    .field label {
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 500;
    }
    
    input[type="text"] {
      width: 100%;
      background: var(--bg-base);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      color: var(--text-main);
      padding: 10px 12px;
      font-family: inherit;
      font-size: 13px;
      outline: none;
      transition: var(--transition);
    }
    input.mono { font-family: ui-monospace, SFMono-Regular, monospace; font-size: 12px; }
    input[type="text"]:focus { border-color: var(--brand-teal); }

    .btn-add {
      background: var(--text-main);
      color: var(--bg-base);
      border: none;
      border-radius: var(--radius-sm);
      padding: 12px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
      margin-top: 4px;
    }
    .btn-add:hover { background: #d4d4d8; }

    .feedback { font-size: 13px; min-height: 18px; margin-top: 4px; font-weight: 500;}
    .feedback.error { color: var(--status-error); }
    .feedback.ok { color: var(--status-success); }

    .hint {
      color: var(--text-muted);
      font-size: 12px;
      line-height: 1.6;
      background: var(--bg-surface);
      padding: 16px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-color);
    }
    .hint code {
      color: var(--brand-teal);
      font-family: ui-monospace, SFMono-Regular, monospace;
      font-weight: bold;
    }
    
    #fileInput { display: none; }
  </style>
</head>
<body>
  <div class="header">
    <h1>Local-Swap</h1>
    <p class="subtitle">Instantly swap between mapped environments while preserving paths, query strings, and hashes.</p>
  </div>

  <div class="content">
    <div class="action-bar">
      <h2>Your Mappings</h2>
      <div class="action-group">
        <button id="btnExport" class="btn-secondary" title="Export as JSON">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
          Export
        </button>
        <button id="btnImport" class="btn-secondary" title="Import from JSON">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5-5 5 5M12 3v12"/></svg>
          Import
        </button>
        <input type="file" id="fileInput" accept=".json" />
      </div>
    </div>

    <div id="ruleList" class="rule-list"></div>

    <div class="add-form">
      <div class="field">
        <label for="ruleLabel">Label (Optional)</label>
        <input type="text" id="ruleLabel" placeholder="e.g. Authentication App" autocomplete="off" />
      </div>
      <div class="field">
        <label for="srcHost">Environment A</label>
        <input type="text" id="srcHost" class="mono" placeholder="auth.production.com" autocomplete="off" spellcheck="false" />
      </div>
      <div class="field">
        <label for="dstHost">Environment B</label>
        <input type="text" id="dstHost" class="mono" placeholder="localhost:3000" autocomplete="off" spellcheck="false" />
      </div>
      <button id="btnAdd" class="btn-add">Add Mapping</button>
      <div id="feedback" class="feedback"></div>
    </div>

    <p class="hint">
      💡 <strong>Pro Tip:</strong> Use <code>Alt+Shift+S</code> to quick-swap the current tab without opening the extension menu.
    </p>
  </div>

  <script src="options.js"></script>
</body>
</html>
